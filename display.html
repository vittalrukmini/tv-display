<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Vittal Rukmini Samsthan – Seva Display</title>
  <!-- SheetJS loaded when switching to real Excel/Google Drive source -->
  <!-- <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script> -->
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #E6B9B8;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* Gold border frame — always on top */
    .border-frame {
      position: fixed;
      inset: 1.5vmin 1.2vmin;
      border: 0.5vmin solid #C99423;
      border-radius: 1vmin;
      pointer-events: none;
      z-index: 1000;
    }

    /* Fullscreen tap overlay */
    #fullscreen-overlay {
      position: fixed; inset: 0;
      background: #232A37;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 2000;
      cursor: pointer;
      gap: 3vmin;
    }
    #fullscreen-overlay img { height: 18vmin; width: auto; object-fit: contain; }
    #fullscreen-overlay .tap-title {
      color: #C99423;
      font-size: 6vmin;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    #fullscreen-overlay .tap-sub {
      color: #ffffff;
      font-size: 3vmin;
    }

    /* Loading / Error screens */
    #loading-screen, #error-screen {
      position: fixed; inset: 0;
      display: flex;
      align-items: center; justify-content: center;
      font-size: 3vmin; color: #0D2D5E;
      background: #F2F2F2;
      z-index: 900;
    }
    #error-screen {
      color: #c0392b;
      text-align: center;
      padding: 4vw;
      flex-direction: column;
      gap: 2vmin;
    }
    #error-screen .error-title {
      font-size: 3.5vmin;
      font-weight: 700;
    }
    #error-message {
      font-size: 2.5vmin;
      max-width: 80vw;
    }

    /* Slideshow container */
    #slideshow {
      position: fixed; inset: 0;
    }

    /* Individual slides */
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      opacity: 0;
      transition: opacity 0.7s ease-in-out;
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5vh 5vw;
      height: 22vh;
      flex-shrink: 0;
    }
    .logo { height: 18vmin; width: auto; object-fit: contain; }

    /* Content area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vmin 5vw 1vmin;
      overflow: hidden;
    }

    /* Slide title */
    .slide-title {
      color: #4709E1;
      font-size: 7vmin;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 2vmin;
      text-transform: uppercase;
    }

    /* Content card */
    .content-card {
      border: 0.35vmin solid #C99423;
      border-radius: 2vmin;
      background: rgba(255, 255, 255, 0.85);
      padding: 3vmin 4vw;
      width: 100%;
      max-width: 88vw;
    }

    /* Single sponsor card (slides 1–3) */
    .single-sponsor { text-align: center; }
    .sponsor-label {
      color: #00B0F0;
      font-size: 3.5vmin;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5vmin;
    }
    .sponsor-date {
      color: #0D2D5E;
      font-size: 4.5vmin;
      font-weight: 600;
      margin-bottom: 1.5vmin;
    }
    .sponsor-name {
      color: #0D2D5E;
      font-size: 6.5vmin;
      font-weight: 700;
    }

    /* Monthly Nithya Seva table (slide 4) */
    .seva-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 2.8vmin;
      color: #0D2D5E;
    }
    .seva-table th {
      color: #00B0F0;
      font-size: 2.8vmin;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.8vmin 1.5vw;
      border-bottom: 0.2vmin solid #C99423;
      text-align: left;
    }
    .seva-table td {
      padding: 0.65vmin 1.5vw;
      border-bottom: 0.1vmin solid rgba(201,148,35,0.25);
    }
    .seva-table .col-date    { width: 24%; }
    .seva-table .col-day     { width: 18%; }
    .seva-table .col-sponsor { width: 58%; font-weight: 600; }
    .seva-table tr:last-child td { border-bottom: none; }
    .monthly-list { overflow-y: auto; max-height: 55vh; }

    /* Bhog Seva current month (slide 5) */
    .bhog-row {
      padding: 1.5vmin 0;
      border-bottom: 0.1vmin solid rgba(201,148,35,0.3);
    }
    .bhog-row:last-child { border-bottom: none; }
    .bhog-sponsor {
      color: #0D2D5E;
      font-size: 4.5vmin;
      font-weight: 600;
    }

    /* Bhog Seva remaining months (slide 6) */
    .bhog-month-group {
      display: flex;
      align-items: baseline;
      gap: 2vw;
      padding: 1.2vmin 0;
      border-bottom: 0.1vmin solid rgba(201,148,35,0.3);
    }
    .bhog-month-group:last-child { border-bottom: none; }
    .bhog-month-label {
      color: #00B0F0;
      font-size: 3vmin;
      font-weight: 700;
      min-width: 16vw;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .bhog-month-sponsors {
      color: #0D2D5E;
      font-size: 3vmin;
      font-weight: 500;
    }

    /* Pushpa Kainkaryam (slide 7) */
    .pushpa-row {
      padding: 1.5vmin 0;
      border-bottom: 0.1vmin solid rgba(201,148,35,0.3);
    }
    .pushpa-row:last-child { border-bottom: none; }
    .pushpa-sponsor {
      color: #0D2D5E;
      font-size: 4.5vmin;
      font-weight: 600;
    }

    /* No-data message */
    .no-data {
      color: #888;
      font-size: 2.5vmin;
      text-align: center;
      font-style: italic;
      padding: 2vmin 0;
    }

    /* Footer */
    .footer {
      flex-shrink: 0;
      height: 7vh;
      background: #232A37;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3vmin;
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    /* Slide counter dot indicators */
    .slide-dots {
      position: fixed;
      bottom: 8.5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.8vmin;
      z-index: 500;
    }
    .dot { width: 1vmin; height: 1vmin; border-radius: 50%; background: rgba(201,148,35,0.35); transition: background 0.3s; }
    .dot.active { background: #C99423; }

    /* Page number in slide title */
    .page-num {
      font-size: 3.5vmin;
      font-weight: 400;
      color: #C99423;
      letter-spacing: 0;
    }

    /* ── Portrait overrides ── */
    @media (orientation: portrait) {
      .header { height: 14vh; padding: 1vmin 4vw; }
      .logo { height: 11vmin; }
      .monthly-list { max-height: 70vh; }
      .bhog-month-label { min-width: 28vw; }
      .slide-dots { bottom: 9.5vh; }
    }
  </style>
</head>
<body>

  <div id="fullscreen-overlay">
    <img src="LOGO/samsthan LOGO.jpg.jpeg" alt="Samsthan">
    <div class="tap-title">Sri Vittal Rukmini Samsthan</div>
    <div class="tap-sub">Tap anywhere to start the display</div>
  </div>

  <div class="border-frame"></div>

  <!-- Tap to enter fullscreen -->
  <div id="fullscreen-overlay" onclick="enterFullscreen()">
    <img src="LOGO/samsthan LOGO.jpg.jpeg" alt="Samsthan">
    <div class="tap-title">Sri Vittal Rukmini Samsthan</div>
    <div class="tap-sub">Tap anywhere to start the display</div>
  </div>

  <div id="loading-screen" style="display:none">
    <p>Loading seva schedule&hellip;</p>
  </div>

  <div id="error-screen" style="display:none">
    <div class="error-title">Unable to Load Schedule</div>
    <p id="error-message"></p>
    <p style="font-size:2vh;color:#555;margin-top:1vh;">
      Ensure <strong>NithyaSeva.xlsx</strong> is in the same folder and the TV has internet access.
    </p>
  </div>

  <div id="slideshow" style="display:none"></div>
  <div class="slide-dots" id="slide-dots" style="display:none"></div>

  <script>
    const SLIDE_DURATION_MS    = 8000;
    const FADE_DURATION_MS     = 700;
    const NEAR_END_THRESHOLD   = 5;
    const NITHYA_ROWS_PER_PAGE = 8;
    const BHOG_GROUPS_PER_PAGE = 6;

    const MONTH_NAMES = [
      'January','February','March','April','May','June',
      'July','August','September','October','November','December'
    ];
    const MONTH_SHORT = [
      'Jan','Feb','Mar','Apr','May','Jun',
      'Jul','Aug','Sep','Oct','Nov','Dec'
    ];

    let currentSlideIndex = 0;

    /* ── Fullscreen ────────────────────────────────────────────── */
    function enterFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) req.call(el).catch(() => {});
      document.getElementById('fullscreen-overlay').style.display = 'none';
      document.getElementById('loading-screen').style.display = 'flex';
      startLoading();
    }

    /* ── Entry point ───────────────────────────────────────────── */
    async function startLoading() {
      try {
        const data = await loadData();
        buildSlides(data);
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('slideshow').style.display = 'block';
        document.getElementById('slide-dots').style.display = 'flex';
        startSlideshow();
        scheduleMidnightRefresh();
      } catch (err) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('error-message').textContent = err.message;
        document.getElementById('error-screen').style.display = 'flex';
      }
    }

    /* ── Google Sheets CSV URLs ────────────────────────────────── */
    const SHEET_URLS = {
      nithyaSeva: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYUYQ9kdtQxtdekqgV-N_ps996BMiLXhwcGfd84jhfVLfPzSlEdgISFqYtDKN3GQ/pub?gid=1478125679&single=true&output=csv',
      bhogSeva:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYUYQ9kdtQxtdekqgV-N_ps996BMiLXhwcGfd84jhfVLfPzSlEdgISFqYtDKN3GQ/pub?gid=31890588&single=true&output=csv',
      pushpa:     'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYUYQ9kdtQxtdekqgV-N_ps996BMiLXhwcGfd84jhfVLfPzSlEdgISFqYtDKN3GQ/pub?gid=262560483&single=true&output=csv'
    };

    /* ── Data loading ──────────────────────────────────────────── */
    async function loadData() {
      const [csvNithya, csvBhog, csvPushpa] = await Promise.all([
        fetchCSV(SHEET_URLS.nithyaSeva),
        fetchCSV(SHEET_URLS.bhogSeva),
        fetchCSV(SHEET_URLS.pushpa)
      ]);
      return {
        nithyaSeva:       parseNithyaSevaCSV(csvNithya),
        bhogSeva:         parseBhogSevaCSV(csvBhog),
        pushpaKainkaryam: parsePushpaKainkaryamCSV(csvPushpa)
      };
    }

    async function fetchCSV(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Failed to load data (HTTP ' + resp.status + ')');
      return resp.text();
    }

    /* ── CSV parser ────────────────────────────────────────────── */
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      return lines.map(line => {
        const cols = [];
        let cur = '', inQuote = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
            else inQuote = !inQuote;
          } else if (ch === ',' && !inQuote) {
            cols.push(cur.trim()); cur = '';
          } else {
            cur += ch;
          }
        }
        cols.push(cur.trim());
        return cols;
      });
    }

    /* ── Sheet parsers ─────────────────────────────────────────── */
    function parseNithyaSevaCSV(csv) {
      const rows = parseCSV(csv);
      const entries = [];
      for (let i = 1; i < rows.length; i++) {
        const row        = rows[i];
        const rawDate    = row[0] || '';
        const rawDay     = (row[1] || '').trim();
        const rawSponsor = (row[2] || '').trim();
        if (!rawDate || !rawSponsor) continue;
        const parsed = parseFlexibleDate(rawDate.trim());
        if (!parsed) continue;
        entries.push({
          date:      parsed,
          dateStr:   rawDate.trim(),
          dayOfWeek: rawDay,
          sponsor:   rawSponsor
        });
      }
      entries.sort((a, b) => a.date - b.date);
      return entries;
    }

    function parseBhogSevaCSV(csv) {
      const rows = parseCSV(csv);
      const entries = [];
      let currentMonth = '', currentMonthNum = -1;
      for (let i = 1; i < rows.length; i++) {
        const row         = rows[i];
        const monthCell   = (row[1] || '').trim();
        const sponsorCell = (row[2] || '').trim();
        const mIdx = MONTH_NAMES.indexOf(monthCell);
        if (mIdx >= 0) { currentMonth = monthCell; currentMonthNum = mIdx; }
        if (sponsorCell && currentMonthNum >= 0) {
          entries.push({
            sno:      parseInt(row[0], 10) || entries.length + 1,
            month:    currentMonth,
            monthNum: currentMonthNum,
            sponsor:  sponsorCell
          });
        }
      }
      return entries;
    }

    function parsePushpaKainkaryamCSV(csv) {
      const rows = parseCSV(csv);
      const entries = [];
      for (let i = 1; i < rows.length; i++) {
        const row     = rows[i];
        const sponsor = (row[1] || '').trim();
        const year    = parseInt(row[2], 10);
        if (sponsor && !isNaN(year)) {
          entries.push({ sno: parseInt(row[0], 10) || i, sponsor, year });
        }
      }
      return entries;
    }

    /* ── Date parsing ──────────────────────────────────────────── */
    function parseFlexibleDate(s) {
      // "25 Jul 2026"
      const p = s.split(/\s+/);
      if (p.length === 3) {
        const day = parseInt(p[0], 10), mIdx = MONTH_SHORT.indexOf(p[1]), yr = parseInt(p[2], 10);
        if (!isNaN(day) && mIdx >= 0 && !isNaN(yr)) return new Date(yr, mIdx, day, 0, 0, 0, 0);
      }
      // "7/25/2026" or "25/07/2026" or "2026-07-25"
      const d = new Date(s);
      if (!isNaN(d.getTime())) { d.setHours(0, 0, 0, 0); return d; }
      return null;
    }

    function formatDateDisplay(date) {
      return date.getDate() + ' ' + MONTH_SHORT[date.getMonth()] + ' ' + date.getFullYear();
    }

    /* ── Business logic ────────────────────────────────────────── */
    function getTodayMidnight() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function shouldShowNextMonth(today) {
      const lastDay   = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
      const daysAfter = lastDay - today.getDate();
      return daysAfter < NEAR_END_THRESHOLD;
    }

    function getTargetMonth(today) {
      if (shouldShowNextMonth(today)) {
        const next = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        return { year: next.getFullYear(), month: next.getMonth() };
      }
      return { year: today.getFullYear(), month: today.getMonth() };
    }

    function getNext3NithyaSevaSponsors(entries, today) {
      return entries.filter(e => e.date >= today).slice(0, 3);
    }

    function getNithyaSevaForMonth(entries, year, month) {
      return entries.filter(e => e.date.getFullYear() === year && e.date.getMonth() === month);
    }

    function getBhogSevaForMonth(entries, monthNum) {
      return entries.filter(e => e.monthNum === monthNum);
    }

    function getBhogSevaRemainingMonths(entries, currentMonthNum) {
      const remaining = entries.filter(e => e.monthNum > currentMonthNum);
      const grouped   = [];
      const seen      = {};
      for (const e of remaining) {
        if (!seen[e.monthNum]) {
          seen[e.monthNum] = { month: e.month, monthNum: e.monthNum, sponsors: [] };
          grouped.push(seen[e.monthNum]);
        }
        seen[e.monthNum].sponsors.push(e.sponsor);
      }
      grouped.sort((a, b) => a.monthNum - b.monthNum);
      return grouped;
    }

    function getPushpaKainkaryamForYear(entries, year) {
      return entries.filter(e => e.year === year);
    }

    function chunkArray(arr, size) {
      if (arr.length === 0) return [[]];
      const chunks = [];
      for (let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));
      return chunks;
    }

    /* ── Slide building ────────────────────────────────────────── */
    function buildSlides(data) {
      const today       = getTodayMidnight();
      const { year: targetYear, month: targetMonth } = getTargetMonth(today);
      const targetLabel = MONTH_NAMES[targetMonth] + ' ' + targetYear;

      const next3       = getNext3NithyaSevaSponsors(data.nithyaSeva, today);
      const monthlyNs   = getNithyaSevaForMonth(data.nithyaSeva, targetYear, targetMonth);
      const bhogCur     = getBhogSevaForMonth(data.bhogSeva, today.getMonth());
      const bhogRemain  = getBhogSevaRemainingMonths(data.bhogSeva, today.getMonth());
      const pushpa      = getPushpaKainkaryamForYear(data.pushpaKainkaryam, today.getFullYear());

      const nsChunks   = chunkArray(monthlyNs, NITHYA_ROWS_PER_PAGE);
      const bhogChunks = chunkArray(bhogRemain, BHOG_GROUPS_PER_PAGE);

      const slides = [
        renderSingleNithyaSevaSlide(next3[0] || null),
        renderSingleNithyaSevaSlide(next3[1] || null),
        renderSingleNithyaSevaSlide(next3[2] || null),
        ...nsChunks.map((chunk, i) =>
          renderNithyaSevaMonthlySlide(chunk, targetLabel, i + 1, nsChunks.length)),
        renderBhogSevaCurrentSlide(bhogCur, MONTH_NAMES[today.getMonth()]),
        ...bhogChunks.map((chunk, i) =>
          renderBhogSevaRemainingSlide(chunk, i + 1, bhogChunks.length)),
        renderPushpaKainkaryamSlide(pushpa, today.getFullYear())
      ];

      const container = document.getElementById('slideshow');
      container.innerHTML = '';
      slides.forEach((html, i) => {
        const div = document.createElement('div');
        div.className = 'slide';
        div.id = 'slide-' + (i + 1);
        if (i === 0) div.classList.add('active');
        div.innerHTML = html;
        container.appendChild(div);
      });

      const dotsEl = document.getElementById('slide-dots');
      dotsEl.innerHTML = '';
      slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dotsEl.appendChild(dot);
      });
    }

    /* ── Shared header / footer ────────────────────────────────── */
    function headerHTML() {
      return `<div class="header">
        <img class="logo logo-left"   src="LOGO/Swami LOGO.jpeg"          alt="Swami" onerror="this.style.visibility='hidden'">
        <img class="logo logo-center" src="LOGO/samsthan LOGO.jpg.jpeg"   alt="Samsthan" onerror="this.style.visibility='hidden'">
        <img class="logo logo-right"  src="LOGO/Anna round copy.png"      alt="Deity" onerror="this.style.visibility='hidden'">
      </div>`;
    }

    function footerHTML() {
      return `<div class="footer">Sri Vittal Rukmini Samsthan Govindapuram</div>`;
    }

    /* ── Slide renderers ───────────────────────────────────────── */
    function renderSingleNithyaSevaSlide(entry) {
      const inner = entry
        ? `<p class="sponsor-label">SPONSOR</p>
           <p class="sponsor-date">${entry.dateStr}${entry.dayOfWeek ? '&nbsp;&nbsp;|&nbsp;&nbsp;' + entry.dayOfWeek : ''}</p>
           <p class="sponsor-name">${entry.sponsor}</p>`
        : `<p class="no-data">No upcoming sponsor scheduled</p>`;
      return `${headerHTML()}
        <div class="content-area">
          <div class="slide-title">Nithya Seva</div>
          <div class="content-card single-sponsor">${inner}</div>
        </div>
        ${footerHTML()}`;
    }

    function renderNithyaSevaMonthlySlide(entries, monthLabel, page, totalPages) {
      const pageStr = totalPages > 1 ? ` &nbsp;<span class="page-num">(${page}/${totalPages})</span>` : '';
      let rows = entries.length === 0
        ? `<tr><td colspan="3" class="no-data">No sponsors scheduled for this period</td></tr>`
        : entries.map(e => `<tr>
            <td class="col-date">${e.dateStr}</td>
            <td class="col-day">${e.dayOfWeek}</td>
            <td class="col-sponsor">${e.sponsor}</td>
          </tr>`).join('');
      return `${headerHTML()}
        <div class="content-area">
          <div class="slide-title">Nithya Seva &mdash; ${monthLabel}${pageStr}</div>
          <div class="content-card monthly-list">
            <table class="seva-table">
              <thead><tr><th>Date</th><th>Day</th><th>Sponsor</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
        ${footerHTML()}`;
    }

    function renderBhogSevaCurrentSlide(entries, monthName) {
      const items = entries.length === 0
        ? `<p class="no-data">No sponsors scheduled for this month</p>`
        : entries.map(e => `<div class="bhog-row"><span class="bhog-sponsor">${e.sponsor}</span></div>`).join('');
      return `${headerHTML()}
        <div class="content-area">
          <div class="slide-title">Bhog Seva &mdash; ${monthName}</div>
          <div class="content-card bhog-current">${items}</div>
        </div>
        ${footerHTML()}`;
    }

    function renderBhogSevaRemainingSlide(grouped, page, totalPages) {
      const pageStr = totalPages > 1 ? ` &nbsp;<span class="page-num">(${page}/${totalPages})</span>` : '';
      const items = grouped.length === 0
        ? `<p class="no-data">No upcoming Bhog Seva sponsors scheduled</p>`
        : grouped.map(g => `<div class="bhog-month-group">
            <span class="bhog-month-label">${g.month}</span>
            <span class="bhog-month-sponsors">${g.sponsors.join('&nbsp;&nbsp;|&nbsp;&nbsp;')}</span>
          </div>`).join('');
      return `${headerHTML()}
        <div class="content-area">
          <div class="slide-title">Bhog Seva &mdash; Upcoming${pageStr}</div>
          <div class="content-card bhog-remaining">${items}</div>
        </div>
        ${footerHTML()}`;
    }

    function renderPushpaKainkaryamSlide(entries, year) {
      const items = entries.length === 0
        ? `<p class="no-data">No sponsors registered for ${year}</p>`
        : entries.map(e => `<div class="pushpa-row"><span class="pushpa-sponsor">${e.sponsor}</span></div>`).join('');
      return `${headerHTML()}
        <div class="content-area">
          <div class="slide-title">Pushpa Kainkaryam &mdash; ${year}</div>
          <div class="content-card pushpa-list">${items}</div>
        </div>
        ${footerHTML()}`;
    }

    /* ── Slideshow timing ──────────────────────────────────────── */
    function showSlide(index) {
      const slides = document.querySelectorAll('#slideshow .slide');
      const dots   = document.querySelectorAll('#slide-dots .dot');
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      if (slides[index]) slides[index].classList.add('active');
      if (dots[index])   dots[index].classList.add('active');
      currentSlideIndex = index;
    }

    function startSlideshow() {
      const total = document.querySelectorAll('#slideshow .slide').length;
      setInterval(() => showSlide((currentSlideIndex + 1) % total), SLIDE_DURATION_MS);
    }

    /* ── Fullscreen on tap ─────────────────────────────────────── */
    document.getElementById('fullscreen-overlay').addEventListener('click', () => {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) req.call(el).catch(() => {});
      document.getElementById('fullscreen-overlay').style.display = 'none';
    });

    /* ── Daily refresh ─────────────────────────────────────────── */
    function scheduleMidnightRefresh() {
      const now      = new Date();
      const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      setTimeout(() => location.reload(), midnight - now);
    }
  </script>
</body>
</html>
